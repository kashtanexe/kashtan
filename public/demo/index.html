<style>
/* Layout: sticky product bar with view tabs; one centred working column per view; cards in a 2-up grid that stacks on phones. */

}
@media (prefers-color-scheme: dark) {

    --line: #2b3244; --accent: #7d95ff; --accent-ink: #0f121a; --accent-soft: #232c4d; --amber: #f0a43a; --amber-soft: #3a2c14;
    --good: #4cc98a; --good-soft: #15301f; --bad: #ff8077; --bad-soft: #3a1a18; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f121a; --surface: #171b26; --surface-2: #202635; --ink: #eef0f5; --ink-2: #b4bacb; --ink-3: #848ba0;
  --line: #2b3244; --accent: #7d95ff; --accent-ink: #0f121a; --accent-soft: #232c4d; --amber: #f0a43a; --amber-soft: #3a2c14;

* { box-sizing: border-box; }

.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
.stack { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 8px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }

.funnel > div:last-child { border-right: 0; }
.funnel .big { font-family: var(--f-mono); font-size: 28px; font-weight: 500; line-height: 1.1; margin-top: 4px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 13.5px; color: var(--ink-2); }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }

.step { font-size: 13px; padding: 5px 10px; border-radius: 99px; background: var(--surface-2); color: var(--ink-3); }

.q .qn { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }
input[type=text], input[type=url], input[type=email], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; }

  function ruleScore(p, ex, gates) {
    const pw = new Set(words(p.oneLiner + " " + p.proof));
    let best = { n: 0, pr: null };
    ex.priorities.forEach((pr) => { const n = words(pr).filter((w) => pw.has(w) || [...pw].some((x) => w.length > 4 && x.startsWith(w.slice(0, 5)))).length; if (n > best.n) best = { n, pr }; });
    let s = [10, 30, 42, 50][Math.min(best.n, 3)];
    const metric = /\d/.test(p.proof), named = (/\p{Lu}\p{Ll}+/u.test(p.proof.slice(1)) || /(bank|banque|insur|assur|retail|détail|distribut|operator|opérateur|telecom|télécom|fintech|mssp|payments|paiement|hospital|hôpital|manufactur|industri)/i.test(p.proof)) && !/fortune|trusted by|customers love|companies|font confiance|nous adorent|entreprises du/i.test(p.proof);
    s += metric && named ? 20 : named ? 10 : 0;
    if (/replac|instead of|remplac|au lieu de/i.test(p.oneLiner)) s += 10;
    const lower = p.oneLiner.toLowerCase(); const buzz = BUZZ.filter((b) => lower.includes(b)).length; s -= buzz * 6;
    s += Math.min(p.compliance.length * 3, 15);
    const wk = (p.timeline.match(/(\d+)\s*(week|semaine)/i) || [])[1]; if (wk && +wk <= 8) s += 5;

    const short = (pr) => pr.split(" ").slice(0, 7).join(" ");

    if (best.pr) pros.push(t("r.match", { p: short(best.pr) })); else cons.push(t("r.noMatch"));

    if (buzz) cons.push(t("r.buzz", { n: buzz }));
    failed.forEach((g) => cons.push(g.detail));
    if (!failed.length && p.compliance.length >= 4) pros.push(t("r.comp"));
    const sc = Math.max(0, Math.round(s));
    return {
      score: sc,
      tldr: [INJECT.test(p.oneLiner + " " + p.proof) ? t("r.inj") : p.oneLiner.length > 110 ? p.oneLiner.slice(0, 107) + "…" : p.oneLiner,

      pros: pros.slice(0, 3), cons: cons.slice(0, 3), action: actionFor(sc, failed.length)

  async function runScoring() {
    const ex = state.exec, d = JSON.parse(JSON.stringify(draft));
    const items = [t("sc.saved") + (d.fast ? t("sc.paid") : ""), t("sc.rules"), t(sampleFn && liveAI ? "sc.claude" : "sc.fit"), t("sc.card")];
    modal('<div class="modal-h"><h3>' + esc(t("sc.qual", { v: d.vendor })) + '</h3></div><div class="modal-b"><div class="progress" id="prog">' + items.map((x, i) => '<div class="prog-item" id="pi' + i + '"><span class="prog-dot"></span><span>' + esc(x) + "</span></div>").join("") + '</div><p class="small muted" id="progNote"></p></div>', true);
    const mark = (i, cls) => { const el = $("#pi" + i); if (el) el.className = "prog-item " + cls; };
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    mark(0, "run"); await wait(500); mark(0, "done");
    mark(1, "run"); await wait(600); const gates = hardGates(d, ex); mark(1, gates.every((g) => g.pass) ? "done" : "fail");
    mark(2, "run");
    let res, ai = false;
    if (sampleFn && liveAI) {
      $("#progNote").textContent = t("sc.asking");
      try { res = await aiScore(d, ex, gates); ai = true; }
      catch (e) {
        if (e && (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "capability_disabled")) { liveAI = false; renderChrome(); }
        const pn = $("#progNote"); if (pn) pn.textContent = t("sc.fallback");
        res = ruleScore(d, ex, gates);
      }
    } else { await wait(900); res = ruleScore(d, ex, gates); }
    mark(2, "done"); mark(3, "run"); await wait(400); mark(3, "done");
    const failed = gates.filter((g) => !g.pass);
    const status = d.fast ? "fasttrack" : (failed.length || res.score < ex.threshold) ? "filtered" : "surfaced";
    const due = new Date(Date.now() + 7 * 864e5).toLocaleDateString(t("locale"), { weekday: "short", day: "numeric", month: "short" });
    const p = Object.assign({}, d, res, { id: "p" + Date.now(), src: d.fromSim ? "fwd" : "link", status, ai, due, ago: "now" });
    delete p.preset; delete p.fromSim;
    if (!p.contact) p.contact = t("unknown"); if (!p.email) p.email = t("noEmail");
    state.pitches.unshift(p); save(); lastResult = p;
    await wait(300); closeModal(); vendorStep = 2; renderChrome(); viewVendor(); window.scrollTo(0, 0);
  }

  }

  // ---------- modal + actions ----------
  function modal(html, locked) {
    $("#modalRoot").innerHTML = '<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true">' + html + "</div></div>";
    if (!locked) $("#mbg").onclick = (e) => { if (e.target.id === "mbg" || e.target.hasAttribute("data-close")) closeModal(); };
  }
  function closeModal() { $("#modalRoot").innerHTML = ""; }

  function openScorecard(p) {
    const gates = hardGates(p, state.exec);
    const list = (arr) => (arr.length ? arr.map((x) => "<li>" + esc(x) + "</li>").join("") : "<li>" + t("none") + "</li>");
    modal('<div class="modal-h"><div><div class="eyebrow">' + t("sc.eyebrow") + '</div><h3 style="margin-top:2px">' + esc(p.vendor) + '</h3></div><button class="btn ghost sm" data-close>' + t("close") + "</button></div><div class=\"modal-b\">" +
      '<div class="row" style="gap:16px;flex-wrap:nowrap">' + ring(p.score, 76) + '<div style="min-width:0"><div class="row" style="gap:6px">' + statusChip(p) + '</div><p class="small muted" style="margin-top:6px">' + esc(p.contact) + " · " + esc(p.email) + " · " + esc(srcText(p)) + '</p><p class="small" style="margin-top:4px"><b>' + t("sc.rec") + "</b> " + esc(L(p, "action")) + "</p></div></div>" +
      '<ul class="tldr">' + L(p, "tldr").map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>" +
      '<div class="pc"><div><div class="eyebrow" style="color:var(--good)">' + t("pros") + "</div><ul>" + list(L(p, "pros")) + '</ul></div><div><div class="eyebrow" style="color:var(--bad)">' + t("cons") + "</div><ul>" + list(L(p, "cons")) + "</ul></div></div>" +
      '<div><div class="eyebrow">' + esc(t("sc.answers")) + '</div><div class="gates" style="margin-top:8px"><div><span><b>' + t("sc.replaces") + "</b> " + esc(L(p, "oneLiner")) + "</span></div><div><span><b>ACV" + COLON + "</b> " + esc(ACV[p.acv]) + " · " + esc(L(p, "timeline")) + "</span></div><div><span><b>" + t("sc.proof") + "</b> " + esc(L(p, "proof")) + "</span></div></div></div>" +
      '<div><div class="eyebrow">' + t("sc.hard") + '</div><div class="gates" style="margin-top:8px">' + gatesHTML(gates) + "</div></div>" +
      (p.status === "surfaced" || p.status === "fasttrack" || p.status === "filtered" ? '<div class="row"><button class="btn good" data-act="accept" data-id="' + p.id + '">' + esc(t("c.accept")) + '</button><button class="btn" data-act="pass" data-id="' + p.id + '">' + t("sc.passFb") + "</button></div>" : "") +
      "</div>");
  }

  function accept(p) {
    const ex = state.exec;
    p.status = "accepted"; p.ago = "now"; save();
    const cons = L(p, "cons");
    modal('<div class="modal-h"><h3>' + t("acc.h") + '</h3><span class="chip good">' + t("acc.chip") + '</span></div><div class="modal-b"><div class="mail"><div class="mail-h">' + mailHead([["m.to", esc(p.email)], ["m.subject", esc(t("acc.subj", { first: ex.first }))]]) + '</div><div class="mail-b">' +
      esc(t("acc.body", { n: p.contact.split(" ")[0], name: ex.name, cal: ex.calendar, c: (cons[0] || t("acc.default")).replace(/^./, (c) => c.toLowerCase()) })) + '</div></div><div class="row"><button class="btn primary" data-close>' + t("done") + "</button></div></div>");
    refresh();
  }
  function passFlow(p) {
    const n = p.contact.split(" ")[0];
    modal('<div class="modal-h"><h3>' + esc(t("pass.h", { v: p.vendor })) + '</h3><button class="btn ghost sm" data-close>' + t("cancel") + '</button></div><div class="modal-b"><p class="muted">' + esc(t("pass.d", { n })) + "</p>" +
      '<div class="reason-btns">' + REASONS.map((r) => '<button class="btn" data-reason="' + r + '">' + esc(t("reason." + r)) + "</button>").join("") + "</div></div>");
    document.querySelectorAll("[data-reason]").forEach((b) => b.onclick = () => {
      p.status = "passed"; p.passReason = b.dataset.reason; p.ago = "now"; save(); closeModal();
      toast(t("pass.toast", { n, r: t("reason." + b.dataset.reason) }) + (p.fast ? t("pass.fast") : ""));
      refresh();
    });
  }
  function refresh() { renderChrome(); if (current === "inbox") viewInbox(); else if (current === "digest") viewDigest(); }

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-view],[data-go],[data-act],[data-filter],[data-lang]");
    if (!el) return;
    if (el.dataset.lang) return setLang(el.dataset.lang);
    if (el.dataset.view) return go(el.dataset.view);
    if (el.dataset.go) { e.preventDefault(); closeModal(); if (el.dataset.go === "vendor") vendorStep = 0; return go(el.dataset.go); }
    if (el.dataset.filter) { filter = el.dataset.filter; return viewInbox(); }
    const p = state.pitches.find((x) => x.id === el.dataset.id); if (!p) return;
    if (el.dataset.act === "open") openScorecard(p);
    if (el.dataset.act === "accept") accept(p);
    if (el.dataset.act === "pass") passFlow(p);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#mbg") && !$("#prog")) closeModal(); });

  $("#resetBtn").onclick = () => { state = fresh(); save(); filter = "all"; sim = { step: 0 }; draft = null; vendorStep = 0; toast(t("resetToast")); go(current); };

  go((location.hash || "").replace("#", "") || "overview");

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("sample").then((fn) => { sampleFn = fn; renderChrome(); const n = $("#aiNote"); if (n) n.textContent = aiNote(); }).catch(() => {});
  }
})();
</script>
</body></html>
